<div class="card projects-small-view">
  <div class="card-header">
    <h2 class="card-title">PROJECTS</h2>
  </div>
  <div class="card-body">
    <div class="container-fluid" *ngFor="let proj of viewData">
      <div class="row">
        <div class="item col-sm-12">
          <div class="circle"></div>
          <h3 class="name">
            {{proj.name}} <small>{{proj.duration}}</small>
          </h3>
          <h4 class="designation">Client: {{proj.clientName}}<span class="duration">
              <small>{{proj.from | date:'MMM, y'}} - {{(proj.to | date:'MMM, y') || 'Present'}}</small>
            </span></h4>

          <div class="more">
            <summary class="font-4 padding-top-10">{{proj.summary}}</summary>
            <div *ngIf="proj.technologies.length" class="padding-top-10 stack">
              <strong>Stack: </strong> <span class="font-4 label">{{proj.technologies.join(', ')}}</span>
            </div>
            <!-- <h3 *ngIf="proj.roles.length" class="font-4 padding-top-10">Roles:</h3>
            <ul *ngIf="proj.roles.length" class="padding-top-10">
              <li class="font-4" *ngFor="let role of proj.roles" [innerHtml]="role"></li>
            </ul> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
